name: drift-weekly

on:
  schedule:
    - cron: "0 13 * * 1"  # every Monday 13:00 UTC
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider:
          - {name: claude, model: claude-sonnet-4-6, key: ANTHROPIC_API_KEY}
          - {name: openai, model: gpt-4o-mini, key: OPENAI_API_KEY}
          - {name: gemini, model: gemini-2.5-pro, key: GEMINI_API_KEY}
        suite:
          - {name: tool_use, path: agent/tool_use}
          - {name: red_team, path: safety/red_team}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e .

      # Restore the historical run DB so we can compare against previous runs.
      - name: Restore run history
        uses: actions/cache@v4
        with:
          path: runs.duckdb
          key: runs-db-${{ matrix.provider.name }}-${{ matrix.suite.name }}
          restore-keys: |
            runs-db-${{ matrix.provider.name }}-${{ matrix.suite.name }}

      - name: Run eval against pinned model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m agent_eval_hub.runner.run_suite \
            --suite suites/${{ matrix.suite.path }}.yaml \
            --provider ${{ matrix.provider.name }} \
            --model ${{ matrix.provider.model }} \
            --db runs.duckdb \
            --git-sha ${{ github.sha }}

      - name: Upload run DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: runs-db-${{ matrix.provider.name }}-${{ matrix.suite.name }}
          path: runs.duckdb
          retention-days: 90

      - name: Open issue on drift
        if: failure() && env.RUN_EXIT == '2'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Drift detected: ${{ matrix.suite.name }} on ${{ matrix.provider.name }}`,
              body: `Weekly drift check found regressions. See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['drift', 'ai-safety']
            })
