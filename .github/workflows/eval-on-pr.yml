name: eval-on-pr

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - name: Fast unit tests
        run: pytest -m "not integration and not e2e and not device"
      - name: Integration tests (stub adapters/devices)
        run: pytest -m integration

  eval-claude:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m agent_eval_hub.runner.run_suite --suite suites/tool_use.yaml --provider claude --model claude-sonnet-4-6
          python -m agent_eval_hub.runner.run_suite --suite suites/red_team.yaml --provider claude --model claude-sonnet-4-6
          python -m agent_eval_hub.runner.run_suite --suite suites/rag_qa.yaml --provider claude --model claude-sonnet-4-6 --judge-provider claude --judge-model claude-opus-4-7

  eval-openai:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m agent_eval_hub.runner.run_suite --suite suites/tool_use.yaml --provider openai --model gpt-4o-mini
          python -m agent_eval_hub.runner.run_suite --suite suites/red_team.yaml --provider openai --model gpt-4o-mini
          # RAG suite uses Claude Opus as judge (stronger than the model under test).
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python -m agent_eval_hub.runner.run_suite --suite suites/rag_qa.yaml --provider openai --model gpt-4o-mini --judge-provider claude --judge-model claude-opus-4-7
          fi

  eval-gemini:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m agent_eval_hub.runner.run_suite --suite suites/tool_use.yaml --provider gemini --model gemini-2.5-pro
          python -m agent_eval_hub.runner.run_suite --suite suites/red_team.yaml --provider gemini --model gemini-2.5-pro
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python -m agent_eval_hub.runner.run_suite --suite suites/rag_qa.yaml --provider gemini --model gemini-2.5-pro --judge-provider claude --judge-model claude-opus-4-7
          fi
