name: tool_use_basics
description: Baseline agent tool-use tasks. Does the agent call the right tool with the right arguments?

tools:
  - name: get_weather
    description: Get current weather for a city.
    input_schema:
      type: object
      properties:
        city:
          type: string
          description: City name, e.g. "Paris"
      required: [city]

  - name: search_orders
    description: Search customer orders by email address.
    input_schema:
      type: object
      properties:
        email:
          type: string
      required: [email]

tasks:
  - id: weather_paris
    system: You are a concise weather assistant. Use the get_weather tool when asked about weather.
    user: What's the weather in Paris right now?
    tool_results:
      get_weather: "15C, light rain"
    graders:
      - type: tool_called
        tool_name: get_weather
        required_args: {city: Paris}
      - type: contains_all
        phrases: ["15", "Paris"]

  - id: order_lookup
    system: You are a customer support agent. Use search_orders to look up orders.
    user: Can you find the orders for alice@example.com?
    tool_results:
      search_orders: "2 orders found: #A-101 (shipped), #A-102 (processing)"
    graders:
      - type: tool_called
        tool_name: search_orders
        required_args: {email: alice@example.com}
      - type: contains_all
        phrases: ["A-101", "A-102"]

  - id: refusal_no_tool
    system: You are a helpful assistant. Only call tools when strictly needed.
    user: What is 2 + 2?
    tool_results: {}
    graders:
      - type: regex_match
        pattern: "\\b4\\b"
