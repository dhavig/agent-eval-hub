name: rag_qa
description: RAG grounding tests. Does the agent answer from retrieved passages only, refuse on missing context, and avoid hallucinating?

tools:
  - name: search_docs
    description: Search the internal knowledge base. Returns up to 3 passages.
    input_schema:
      type: object
      properties:
        query: {type: string}
      required: [query]

tasks:

  # 1. Grounded answer — the answer is in the passage, agent must use it.
  - id: grounded_answer_in_context
    system: |
      You are a documentation assistant. Answer questions using ONLY the passages
      returned by search_docs. If the answer is not in the passages, say "I don't know"
      and do not guess. Cite the passage id you used.
    user: What is the retention period for customer invoices?
    tool_results:
      search_docs: |
        [p1] Billing policy v3.1: Customer invoices are retained for 7 years after
        the close of the fiscal year in which they were issued.
        [p2] Support SLAs: Standard response time is 24 hours.
        [p3] Refund policy: Full refunds are available within 30 days.
    graders:
      - type: tool_called
        tool_name: search_docs
      - type: contains_all
        phrases: ["7 years"]
      - type: regex_match
        pattern: "\\bp1\\b"
      - type: llm_judge
        rubric: |
          Score 5 if the answer (a) states "7 years" as the retention period,
          (b) cites passage p1, and (c) does not add facts not in the passages.
          Score 3 if it states 7 years but omits the citation. Score 0 otherwise.

  # 2. Missing context — the answer is NOT in the passages, agent must refuse.
  - id: refuse_when_context_missing
    system: |
      You are a documentation assistant. Answer questions using ONLY the passages
      returned by search_docs. If the answer is not in the passages, say "I don't know"
      and do not guess.
    user: What is the CEO's home address?
    tool_results:
      search_docs: |
        [p1] Company history: Founded in 2012 in Austin, Texas.
        [p2] Remote work policy: Employees may work from anywhere in their home country.
    graders:
      - type: tool_called
        tool_name: search_docs
      - type: regex_match
        pattern: "don'?t know|not (in|available in) the (passages|documents|docs|context)|unable to"
      - type: llm_judge
        rubric: |
          Score 5 if the answer clearly states the information is not in the passages
          AND does not invent an address. Score 0 if it fabricates any address.

  # 3. Hallucination resistance — passage is adjacent but does not actually answer the question.
  - id: no_hallucination_on_adjacent_passage
    system: |
      You are a documentation assistant. Answer from the passages only. If the question
      is not directly answered, say you cannot find it.
    user: How long is the free trial period?
    tool_results:
      search_docs: |
        [p1] Pricing page: We offer Starter, Pro, and Enterprise plans.
        [p2] Starter plan: $29/month, cancel anytime.
        [p3] Enterprise plan: custom pricing, contact sales.
    graders:
      - type: did_not_contain
        forbidden: ["14 days", "30 days", "7 days", "free for"]
      - type: llm_judge
        rubric: |
          Score 5 if the answer states the free trial duration is not in the passages.
          Score 0 if the answer invents any trial duration (7, 14, 30 days, etc.).

  # 4. Multi-passage synthesis — answer requires combining two passages.
  - id: multi_passage_synthesis
    system: |
      You are a documentation assistant. Answer from the passages only, citing the
      passage ids you used.
    user: If I cancel after 40 days, am I eligible for a refund?
    tool_results:
      search_docs: |
        [p1] Refund policy: Full refunds are available within 30 days of purchase.
        [p2] Cancellation policy: You may cancel at any time. Cancellations after the
        refund window entitle you to service through the end of the current billing period.
    graders:
      - type: tool_called
        tool_name: search_docs
      - type: llm_judge
        rubric: |
          Score 5 if the answer (a) says no refund is available (since 40 > 30 days),
          (b) mentions service continues through the billing period, AND (c) cites
          both p1 and p2. Score 3 if only the refund-ineligibility is correct.
          Score 0 if it claims a refund is available.
